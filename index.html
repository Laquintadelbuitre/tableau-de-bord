<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cockpit Saison — U13 Limoges Football</title>
<style>
  :root{
    --fond:#0f1115;
    --panneau:#1a1d24;
    --panneau-clair:#22262f;
    --texte:#eef0f3;
    --texte-att:#9aa0ad;
    --ligne:#2c303a;
    --bleu:#4a7dd6;
    --vert:#3a9d5a;
    --or:#d4a82e;
    --rouge:#c4392f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--fond);color:var(--texte);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;}
  .wrap{max-width:700px;margin:0 auto;padding:20px 16px 60px;}

  /* HEADER */
  .header{text-align:center;margin-bottom:22px;}
  .header .tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-att);border:1px solid var(--ligne);border-radius:999px;padding:4px 12px;margin-bottom:10px;}
  .header h1{font-size:24px;font-weight:700;margin:0 0 4px;}
  .header .date{font-size:13px;color:var(--texte-att);}

  /* AUTH */
  .auth-box{background:var(--panneau);border:1px solid var(--ligne);border-radius:18px;padding:24px;max-width:340px;margin:0 auto;}
  .auth-box h2{font-size:17px;margin:0 0 16px;text-align:center;}
  .auth-box input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ligne);background:var(--panneau-clair);color:var(--texte);font-size:22px;letter-spacing:.4em;text-align:center;margin-bottom:12px;}
  .auth-box button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--bleu);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-erreur{color:#e8a39d;font-size:13px;text-align:center;margin-top:8px;display:none;}

  /* CHARGEMENT */
  .chargement{text-align:center;padding:40px;color:var(--texte-att);}
  .chargement .spinner{font-size:32px;display:block;margin-bottom:12px;animation:spin 1.5s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg)};}

  /* RÉSUMÉ ÉQUIPE */
  .resume-equipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .resume-card{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:14px;text-align:center;}
  .resume-card .r-val{font-size:26px;font-weight:800;}
  .resume-card .r-lbl{font-size:11px;color:var(--texte-att);margin-top:4px;}

  /* FILTRES */
  .filtres{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filtre-btn{background:var(--panneau-clair);border:1px solid var(--ligne);color:var(--texte-att);font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer;}
  .filtre-btn.active{border-color:var(--bleu);color:var(--texte);background:rgba(74,125,214,.15);}

  /* GRILLE JOUEURS */
  .grille-cockpit{display:flex;flex-direction:column;gap:10px;}

  .joueur-cockpit{
    background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;
    padding:14px 16px;cursor:pointer;
    transition:border-color .15s ease;
  }
  .joueur-cockpit:hover{border-color:rgba(74,125,214,.4);}
  .joueur-cockpit.risque-vert{border-left:4px solid var(--vert);}
  .joueur-cockpit.risque-or{border-left:4px solid var(--or);}
  .joueur-cockpit.risque-rouge{border-left:4px solid var(--rouge);}

  .joueur-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .joueur-indicateur{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .joueur-indicateur.vert{background:rgba(58,157,90,.2);}
  .joueur-indicateur.or{background:rgba(212,168,46,.2);}
  .joueur-indicateur.rouge{background:rgba(196,57,47,.2);}
  .joueur-nom{flex:1;font-size:16px;font-weight:700;}
  .joueur-blessure{font-size:11px;background:rgba(196,57,47,.15);color:var(--rouge);border:1px solid rgba(196,57,47,.3);padding:3px 8px;border-radius:999px;}
  .joueur-absences{font-size:11px;color:var(--texte-att);}

  .joueur-metriques{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .metrique{background:var(--panneau-clair);border-radius:10px;padding:10px 8px;text-align:center;}
  .metrique .m-val{font-size:18px;font-weight:700;margin-bottom:2px;}
  .metrique .m-lbl{font-size:10px;color:var(--texte-att);line-height:1.3;}
  .metrique .m-trend{font-size:10px;margin-top:2px;}

  /* Couleurs métriques */
  .m-vert{color:var(--vert);}
  .m-or{color:var(--or);}
  .m-rouge{color:var(--rouge);}
  .m-gris{color:var(--texte-att);}

  /* DÉTAIL JOUEUR (expand) */
  .joueur-detail{display:none;margin-top:12px;border-top:1px solid var(--ligne);padding-top:12px;}
  .joueur-detail.show{display:block;}

  .detail-section{margin-bottom:12px;}
  .detail-titre{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--texte-att);margin-bottom:8px;font-weight:700;}
  .detail-ligne{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--ligne);}
  .detail-ligne:last-child{border-bottom:none;}
  .detail-ligne .d-lbl{color:var(--texte-att);}
  .detail-ligne .d-val{font-weight:600;}

  .historique-mini{display:flex;gap:4px;margin-top:6px;}
  .histo-point{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .histo-point.nv1{background:rgba(58,157,90,.2);color:var(--vert);}
  .histo-point.nv2{background:rgba(212,168,46,.15);color:var(--or);}
  .histo-point.nv3{background:rgba(212,113,31,.2);color:#d4711f;}
  .histo-point.nv4{background:rgba(196,57,47,.2);color:var(--rouge);}
  .histo-point.nv5{background:rgba(74,74,82,.3);color:#9aa0ad;}
  .histo-point.rpe-bas{background:rgba(58,157,90,.2);color:var(--vert);}
  .histo-point.rpe-moy{background:rgba(212,168,46,.15);color:var(--or);}
  .histo-point.rpe-haut{background:rgba(196,57,47,.2);color:var(--rouge);}

  .alerte-ligne{background:rgba(196,57,47,.08);border:1px solid rgba(196,57,47,.25);border-radius:8px;padding:8px 10px;font-size:12px;color:#e8a39d;margin-top:6px;}

  /* ACTIONS */
  .actions-bar{display:flex;gap:10px;margin-bottom:18px;}
  .actions-bar button{flex:1;background:var(--panneau);border:1px solid var(--ligne);color:var(--texte-att);padding:10px;border-radius:10px;font-size:13px;cursor:pointer;}
  .actions-bar button:hover{border-color:var(--bleu);color:var(--texte);}

  .footer-note{text-align:center;color:var(--texte-att);font-size:11.5px;margin-top:26px;line-height:1.5;}
  .last-update{text-align:right;font-size:11px;color:var(--texte-att);margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="tag">Cockpit · U13 Limoges Football</span>
    <h1>📊 Vue Saison</h1>
    <div class="date" id="dateAffichee"></div>
  </div>

  <!-- AUTH -->
  <div id="ecranAuth">
    <div class="auth-box">
      <h2>Accès coach</h2>
      <input type="tel" inputmode="numeric" maxlength="4" id="inputPIN" placeholder="••••">
      <button id="btnAuth">Accéder</button>
      <div class="auth-erreur" id="authErreur">Code incorrect.</div>
    </div>
  </div>

  <!-- COCKPIT -->
  <div id="ecranCockpit" style="display:none;">

    <div class="actions-bar">
      <button id="btnActualiser">🔄 Actualiser</button>
      <button id="btnDeconnexion">🔒 Verrouiller</button>
    </div>

    <!-- CHARGEMENT -->
    <div class="chargement" id="chargement">
      <span class="spinner">⚙️</span>
      Chargement des données…
    </div>

    <!-- CONTENU -->
    <div id="contenuCockpit" style="display:none;">

      <div class="last-update" id="lastUpdate"></div>

      <!-- Résumé équipe -->
      <div class="resume-equipe">
        <div class="resume-card">
          <div class="r-val" id="resVert" style="color:var(--vert)">—</div>
          <div class="r-lbl">🟢 En forme</div>
        </div>
        <div class="resume-card">
          <div class="r-val" id="resOr" style="color:var(--or)">—</div>
          <div class="r-lbl">🟡 À surveiller</div>
        </div>
        <div class="resume-card">
          <div class="r-val" id="resRouge" style="color:var(--rouge)">—</div>
          <div class="r-lbl">🔴 À risque</div>
        </div>
        <div class="resume-card">
          <div class="r-val" id="resBlessures" style="color:var(--rouge)">—</div>
          <div class="r-lbl">🤕 Blessés</div>
        </div>
      </div>

      <!-- Filtres -->
      <div class="filtres">
        <button class="filtre-btn active" data-filtre="tous">Tous</button>
        <button class="filtre-btn" data-filtre="rouge">🔴 À risque</button>
        <button class="filtre-btn" data-filtre="or">🟡 À surveiller</button>
        <button class="filtre-btn" data-filtre="vert">🟢 En forme</button>
        <button class="filtre-btn" data-filtre="blesse">🤕 Blessés</button>
      </div>

      <!-- Grille joueurs -->
      <div class="grille-cockpit" id="grilleCockpit"></div>

    </div>
  </div>

  <div class="footer-note">
    Données agrégées depuis Météo · RPE · Match Day · Blessures<br>
    Mise à jour à chaque actualisation
  </div>

</div>
<script>
(function(){

  var CODE_PIN = "0501";
  var SESSION_KEY = "cockpit_auth";

  var URL_METEO    = "https://script.google.com/macros/s/AKfycby9nP9dZjcJHINPigF8_cBBbBEcRXk-buyNKW6vvs4zpnz2e9UYXzB8OzzCuLg5C9A73g/exec";
  var URL_RPE      = "https://script.google.com/macros/s/AKfycbxpcsBjwqNDR7LkbT53krZK2d29iQlDzpOUovqD2FCnEGHjENNWE6orj6upb7PtHrLo/exec";
  var URL_MATCHDAY = "https://script.google.com/macros/s/AKfycbzYTdTfQWN9CCujM7p4JwNplNgmOIz9HyA1hv609FQWiQeRXlYE3h-Xj40ekKI5Wpwpaw/exec";
  var URL_BLESSURE = "https://script.google.com/macros/s/AKfycby1AFv80LuZ9lDI1jK22YOwFLhccuX6V2AU3LVVT15qHQKWFi62b_HTKZOSop6Exn2t/exec";

  var EFFECTIF = ["Abdoul Karim","Adam","Bakoutoubo","Bilel","Emir","Ethan","Gabin","Hadi","Issam","Jalil","Kalifa","Keys","Loan","Mathis","Melih","Mickaël","Nourou","Pablo","Sacha","Sarah","Sebastien","Yanis"];

  var moisFr = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var joursFr = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  function formatDate(d){ return joursFr[d.getDay()]+" "+d.getDate()+" "+moisFr[d.getMonth()]+" "+d.getFullYear(); }
  function clefISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function normalDate(str){
    if(!str) return "";
    if(str.length > 10) return str.substring(0,10);
    return str;
  }

  document.getElementById("dateAffichee").textContent = formatDate(new Date());

  var filtreActif = "tous";
  var donneesCockpit = null;

  // ---- AUTH ----
  var inputPIN = document.getElementById("inputPIN");
  inputPIN.addEventListener("input", function(){ this.value=this.value.replace(/[^0-9]/g,"").slice(0,4); });

  document.getElementById("btnAuth").addEventListener("click", function(){
    if(inputPIN.value.trim() !== CODE_PIN){
      document.getElementById("authErreur").style.display="block";
      return;
    }
    sessionStorage.setItem(SESSION_KEY, "1");
    ouvrirCockpit();
  });

  // Auto-connexion si session active
  if(sessionStorage.getItem(SESSION_KEY)==="1") ouvrirCockpit();

  function ouvrirCockpit(){
    document.getElementById("ecranAuth").style.display="none";
    document.getElementById("ecranCockpit").style.display="block";
    chargerTout();
  }

  document.getElementById("btnDeconnexion").addEventListener("click", function(){
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  document.getElementById("btnActualiser").addEventListener("click", chargerTout);

  // ---- FILTRES ----
  document.querySelectorAll(".filtre-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".filtre-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      filtreActif = btn.getAttribute("data-filtre");
      if(donneesCockpit) afficherCockpit(donneesCockpit);
    });
  });

  // ---- CHARGEMENT DONNÉES ----
  function chargerTout(){
    document.getElementById("chargement").style.display="block";
    document.getElementById("contenuCockpit").style.display="none";

    Promise.all([
      fetch(URL_METEO).then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch(URL_RPE+"?type=rpe_post").then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch(URL_MATCHDAY+"?type=hooper").then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch(URL_BLESSURE).then(function(r){ return r.json(); }).catch(function(){ return []; })
    ]).then(function(resultats){
      var data = {
        meteo: resultats[0],
        rpe: resultats[1],
        hooper: resultats[2],
        blessures: resultats[3]
      };
      donneesCockpit = analyserDonnees(data);
      afficherCockpit(donneesCockpit);
      document.getElementById("lastUpdate").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", {hour:"2-digit",minute:"2-digit"});
    }).catch(function(){
      document.getElementById("chargement").innerHTML = '<div style="color:var(--texte-att);padding:30px;text-align:center;">Impossible de charger certaines données. Vérifiez votre connexion.</div>';
    });
  }

  // ---- ANALYSE ----
  function analyserDonnees(data){
    var aujourd_hui = new Date();
    var joueurs = {};

    EFFECTIF.forEach(function(nom){
      joueurs[nom] = {
        nom: nom,
        meteo: { dernieres: [], moyenne: null },
        rpe: { dernieres: [], moyenne: null, alerteIntense: false },
        hooper: { dernier: null, moyenne: null },
        blessure: { actuelle: null, joursAbsence: 0 },
        risque: "vert",
        alertes: []
      };
    });

    // MÉTÉO : 4 dernières séances par joueur
    var meteoParJoueur = {};
    (data.meteo||[]).forEach(function(d){
      var nom = d.nom; var n = parseInt(d.niveau,10);
      if(!meteoParJoueur[nom]) meteoParJoueur[nom] = [];
      meteoParJoueur[nom].push({date: normalDate(d.date), heure: d.heure, niveau: n});
    });
    Object.keys(meteoParJoueur).forEach(function(nom){
      if(!joueurs[nom]) return;
      var tri = meteoParJoueur[nom].sort(function(a,b){ return a.date<b.date?1:-1; }).slice(0,8);
      joueurs[nom].meteo.dernieres = tri;
      if(tri.length>0){
        var somme=0; tri.slice(0,4).forEach(function(d){ somme+=d.niveau; });
        joueurs[nom].meteo.moyenne = (somme/Math.min(tri.length,4)).toFixed(1);
      }
    });

    // RPE : 4 dernières séances
    var rpeParJoueur = {};
    (data.rpe||[]).forEach(function(d){
      var nom=d.nom; var n=parseInt(d.rpe,10);
      if(!rpeParJoueur[nom]) rpeParJoueur[nom]=[];
      rpeParJoueur[nom].push({date:normalDate(d.date), rpe:n});
    });
    Object.keys(rpeParJoueur).forEach(function(nom){
      if(!joueurs[nom]) return;
      var tri = rpeParJoueur[nom].sort(function(a,b){ return a.date<b.date?1:-1; }).slice(0,8);
      joueurs[nom].rpe.dernieres = tri;
      if(tri.length>0){
        var somme=0; tri.slice(0,4).forEach(function(d){ somme+=d.rpe; });
        joueurs[nom].rpe.moyenne = (somme/Math.min(tri.length,4)).toFixed(1);
        // Alerte : 2 RPE ≥ 8 sur les 3 dernières séances
        var recentes = tri.slice(0,3);
        var nbIntense = recentes.filter(function(d){ return d.rpe>=8; }).length;
        if(nbIntense>=2) joueurs[nom].rpe.alerteIntense=true;
      }
    });

    // HOOPER : dernier score et moyenne
    var hooperParJoueur = {};
    (data.hooper||[]).forEach(function(d){
      if(d.palier==="_verif") return;
      var nom=d.nom;
      if(!hooperParJoueur[nom]) hooperParJoueur[nom]=[];
      var total = (parseInt(d.sommeil,10)||0)+(parseInt(d.fatigue,10)||0)+(parseInt(d.humeur,10)||0)+(parseInt(d.douleurs,10)||0)+(parseInt(d.motivation,10)||0);
      hooperParJoueur[nom].push({date:normalDate(d.date), total:total, detail:d});
    });
    Object.keys(hooperParJoueur).forEach(function(nom){
      if(!joueurs[nom]) return;
      var tri = hooperParJoueur[nom].sort(function(a,b){ return a.date<b.date?1:-1; });
      joueurs[nom].hooper.dernier = tri[0]||null;
      if(tri.length>0){
        var somme=0; tri.slice(0,5).forEach(function(d){ somme+=d.total; });
        joueurs[nom].hooper.moyenne = (somme/Math.min(tri.length,5)).toFixed(1);
      }
    });

    // BLESSURES
    (data.blessures||[]).forEach(function(d){
      var nom=d.nom||d.joueur;
      if(!joueurs[nom]) return;
      // Chercher blessure active (sans date de retour ou date retour dans le futur)
      var dateRetour = d.date_retour||d.retour||"";
      var actif = !dateRetour || normalDate(dateRetour) > clefISO(aujourd_hui);
      if(actif && !joueurs[nom].blessure.actuelle){
        joueurs[nom].blessure.actuelle = d;
      }
      // Compter jours d'absence sur la saison
      if(d.date_debut||d.date){
        var debut = new Date((d.date_debut||d.date)+"T12:00:00");
        var fin = dateRetour ? new Date(dateRetour+"T12:00:00") : aujourd_hui;
        var jours = Math.max(0, Math.round((fin-debut)/86400000));
        joueurs[nom].blessure.joursAbsence += jours;
      }
    });

    // CALCUL DU RISQUE GLOBAL
    EFFECTIF.forEach(function(nom){
      var j = joueurs[nom];
      var score = 0; // Plus c'est élevé, plus c'est risqué

      if(j.blessure.actuelle){ j.risque="rouge"; j.alertes.push("🤕 Blessure en cours"); return; }

      var moyMeteo = parseFloat(j.meteo.moyenne);
      var moyRPE = parseFloat(j.rpe.moyenne);
      var moyHooper = parseFloat(j.hooper.moyenne);

      if(!isNaN(moyMeteo)){
        if(moyMeteo>=4) score+=3;
        else if(moyMeteo>=3) score+=1;
      }
      if(!isNaN(moyRPE)){
        if(moyRPE>=8) score+=2;
        else if(moyRPE>=6.5) score+=1;
      }
      if(j.rpe.alerteIntense){ score+=2; j.alertes.push("⚡ RPE ≥ 8 deux fois récemment"); }
      if(!isNaN(moyHooper)){
        if(moyHooper>=18) score+=3;
        else if(moyHooper>=14) score+=1;
      }
      if(j.blessure.joursAbsence>=14) score+=1;

      if(score>=5) j.risque="rouge";
      else if(score>=2) j.risque="or";
      else j.risque="vert";

      if(!isNaN(moyMeteo) && moyMeteo>=4) j.alertes.push("😴 Fatigue élevée en séance (météo moy. "+moyMeteo+")");
      if(!isNaN(moyHooper) && moyHooper>=18) j.alertes.push("📋 Score Hooper préoccupant ("+moyHooper+"/25)");
    });

    return joueurs;
  }

  // ---- AFFICHAGE ----
  function afficherCockpit(joueurs){
    document.getElementById("chargement").style.display="none";
    document.getElementById("contenuCockpit").style.display="block";

    var nbVert=0,nbOr=0,nbRouge=0,nbBlesses=0;
    EFFECTIF.forEach(function(nom){
      var j=joueurs[nom];
      if(j.blessure.actuelle) nbBlesses++;
      if(j.risque==="vert") nbVert++;
      else if(j.risque==="or") nbOr++;
      else nbRouge++;
    });
    document.getElementById("resVert").textContent=nbVert;
    document.getElementById("resOr").textContent=nbOr;
    document.getElementById("resRouge").textContent=nbRouge;
    document.getElementById("resBlessures").textContent=nbBlesses;

    var liste = EFFECTIF.filter(function(nom){
      var j=joueurs[nom];
      if(filtreActif==="tous") return true;
      if(filtreActif==="blesse") return !!j.blessure.actuelle;
      return j.risque===filtreActif;
    });

    // Trier : rouge d'abord, puis or, puis vert
    liste.sort(function(a,b){
      var ordre={rouge:0,or:1,vert:2};
      return ordre[joueurs[a].risque]-ordre[joueurs[b].risque];
    });

    var grille=document.getElementById("grilleCockpit");
    grille.innerHTML="";

    liste.forEach(function(nom){
      var j=joueurs[nom];
      var emojis={vert:"🟢",or:"🟡",rouge:"🔴"};

      var card=document.createElement("div");
      card.className="joueur-cockpit risque-"+j.risque;

      // Métriques
      var moyMeteo = j.meteo.moyenne!==null ? j.meteo.moyenne : "—";
      var moyRPE   = j.rpe.moyenne!==null   ? j.rpe.moyenne   : "—";
      var hooScore = j.hooper.dernier        ? j.hooper.dernier.total+"/25" : "—";
      var hooMoy   = j.hooper.moyenne!==null ? j.hooper.moyenne : null;

      var classeMeteo="m-gris", classeRPE="m-gris", classeHooper="m-gris";
      if(j.meteo.moyenne!==null){
        var m=parseFloat(j.meteo.moyenne);
        classeMeteo = m<=2?"m-vert":m<=3?"m-or":"m-rouge";
      }
      if(j.rpe.moyenne!==null){
        var r=parseFloat(j.rpe.moyenne);
        classeRPE = r<=5?"m-vert":r<=7?"m-or":"m-rouge";
      }
      if(j.hooper.moyenne!==null){
        var h=parseFloat(j.hooper.moyenne);
        classeHooper = h<=10?"m-vert":h<=16?"m-or":"m-rouge";
      }

      // Historique météo mini (8 dernières)
      var histoMeteo="";
      j.meteo.dernieres.slice(0,6).forEach(function(d){
        histoMeteo+='<div class="histo-point nv'+d.niveau+'">'+d.niveau+'</div>';
      });

      // Historique RPE mini
      var histoRPE="";
      j.rpe.dernieres.slice(0,6).forEach(function(d){
        var cls = d.rpe<=5?"rpe-bas":d.rpe<=7?"rpe-moy":"rpe-haut";
        histoRPE+='<div class="histo-point '+cls+'">'+d.rpe+'</div>';
      });

      // Alertes
      var alertesHTML="";
      j.alertes.forEach(function(a){
        alertesHTML+='<div class="alerte-ligne">'+a+'</div>';
      });

      var blessureTag = j.blessure.actuelle
        ? '<span class="joueur-blessure">🤕 Blessé</span>'
        : (j.blessure.joursAbsence>0 ? '<span class="joueur-absences">'+j.blessure.joursAbsence+'j abs.</span>' : '');

      card.innerHTML =
        '<div class="joueur-header">'+
          '<div class="joueur-indicateur '+j.risque+'">'+emojis[j.risque]+'</div>'+
          '<div class="joueur-nom">'+escapeHTML(nom)+'</div>'+
          blessureTag+
        '</div>'+
        '<div class="joueur-metriques">'+
          '<div class="metrique"><div class="m-val '+classeMeteo+'">'+moyMeteo+'</div><div class="m-lbl">Météo moy.<br>/5</div></div>'+
          '<div class="metrique"><div class="m-val '+classeRPE+'">'+moyRPE+'</div><div class="m-lbl">RPE moy.<br>/10</div></div>'+
          '<div class="metrique"><div class="m-val '+classeHooper+'">'+hooScore+'</div><div class="m-lbl">Hooper<br>dernier</div></div>'+
          '<div class="metrique"><div class="m-val '+(j.alertes.length>0?"m-rouge":"m-vert")+'">'+j.alertes.length+'</div><div class="m-lbl">Alerte'+(j.alertes.length!==1?"s":"")+'</div></div>'+
        '</div>'+
        '<div class="joueur-detail" id="detail-'+nom.replace(/\s/g,"_")+'">' +
          (alertesHTML ? '<div class="detail-section">'+alertesHTML+'</div>' : '') +
          (histoMeteo ? '<div class="detail-section"><div class="detail-titre">Météo — 6 dernières séances</div><div class="historique-mini">'+histoMeteo+'</div></div>' : '') +
          (histoRPE ? '<div class="detail-section"><div class="detail-titre">RPE — 6 dernières séances</div><div class="historique-mini">'+histoRPE+'</div></div>' : '') +
          (hooMoy ? '<div class="detail-section"><div class="detail-ligne"><span class="d-lbl">Hooper moyen (matchs)</span><span class="d-val">'+hooMoy+'/25</span></div></div>' : '') +
          (j.blessure.joursAbsence>0 ? '<div class="detail-section"><div class="detail-ligne"><span class="d-lbl">Jours d\'absence saison</span><span class="d-val">'+j.blessure.joursAbsence+' j</span></div></div>' : '') +
        '</div>';

      // Click pour expand/collapse
      card.addEventListener("click", function(){
        var detail=document.getElementById("detail-"+nom.replace(/\s/g,"_"));
        detail.classList.toggle("show");
      });

      grille.appendChild(card);
    });

    if(liste.length===0){
      grille.innerHTML='<div style="text-align:center;color:var(--texte-att);padding:30px;">Aucun joueur dans cette catégorie.</div>';
    }
  }

  function escapeHTML(s){ var d=document.createElement("div");d.textContent=s;return d.innerHTML; }

})();
</script>
</body>
</html>
