<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>Cockpit Saison — U13 Limoges Football</title>
<style>
  :root{
    --fond:#0f1115;--panneau:#1a1d24;--panneau-clair:#22262f;
    --texte:#eef0f3;--texte-att:#9aa0ad;--ligne:#2c303a;
    --bleu:#4a7dd6;--vert:#3a9d5a;--or:#d4a82e;--rouge:#c4392f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--fond);color:var(--texte);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;}
  .wrap{max-width:700px;margin:0 auto;padding:20px 16px 60px;}

  .header{text-align:center;margin-bottom:20px;}
  .header .tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-att);border:1px solid var(--ligne);border-radius:999px;padding:4px 12px;margin-bottom:10px;}
  .header h1{font-size:24px;font-weight:700;margin:0 0 4px;}
  .header .date{font-size:13px;color:var(--texte-att);}

  /* AUTH */
  .auth-box{background:var(--panneau);border:1px solid var(--ligne);border-radius:18px;padding:24px;max-width:340px;margin:0 auto;}
  .auth-box h2{font-size:17px;margin:0 0 16px;text-align:center;}
  .auth-box input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ligne);background:var(--panneau-clair);color:var(--texte);font-size:22px;letter-spacing:.4em;text-align:center;margin-bottom:12px;}
  .auth-box button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--bleu);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-erreur{color:#e8a39d;font-size:13px;text-align:center;margin-top:8px;display:none;}

  /* ACTIONS */
  .actions-bar{display:flex;gap:10px;margin-bottom:16px;}
  .actions-bar button{flex:1;background:var(--panneau);border:1px solid var(--ligne);color:var(--texte-att);padding:10px;border-radius:10px;font-size:13px;cursor:pointer;}
  .actions-bar button:hover{border-color:var(--bleu);color:var(--texte);}

  /* VUES */
  .vues-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px;}
  .vue-tab{
    background:var(--panneau);border:1.5px solid var(--ligne);color:var(--texte-att);
    padding:10px 6px;border-radius:12px;cursor:pointer;text-align:center;
    font-size:12px;font-weight:700;
  }
  .vue-tab.active{border-color:var(--bleu);background:rgba(74,125,214,.12);color:var(--texte);}

  /* DESC VUE */
  .vue-desc{
    background:var(--panneau-clair);border:1px solid var(--ligne);border-radius:10px;
    padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--texte-att);line-height:1.5;
  }

  /* CHARGEMENT */
  .chargement{text-align:center;padding:40px;color:var(--texte-att);}
  .spinner{font-size:28px;display:block;margin-bottom:12px;animation:spin 1.5s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg)}}

  /* RÉSUMÉ ÉQUIPE */
  .resume-equipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .resume-card{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:12px 8px;text-align:center;}
  .resume-card .r-val{font-size:24px;font-weight:800;}
  .resume-card .r-lbl{font-size:10px;color:var(--texte-att);margin-top:3px;}

  /* FILTRES */
  .filtres{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filtre-btn{background:var(--panneau-clair);border:1px solid var(--ligne);color:var(--texte-att);font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;}
  .filtre-btn.active{border-color:var(--bleu);color:var(--texte);background:rgba(74,125,214,.15);}

  /* GRILLE JOUEURS */
  .grille-cockpit{display:flex;flex-direction:column;gap:10px;}
  .joueur-cockpit{background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;padding:14px 16px;cursor:pointer;}
  .joueur-cockpit.risque-vert{border-left:4px solid var(--vert);}
  .joueur-cockpit.risque-or{border-left:4px solid var(--or);}
  .joueur-cockpit.risque-rouge{border-left:4px solid var(--rouge);}
  .joueur-cockpit.bilan{border-left:4px solid var(--bleu);}

  .joueur-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .joueur-indicateur{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .joueur-indicateur.vert{background:rgba(58,157,90,.2);}
  .joueur-indicateur.or{background:rgba(212,168,46,.2);}
  .joueur-indicateur.rouge{background:rgba(196,57,47,.2);}
  .joueur-indicateur.bilan{background:rgba(74,125,214,.2);}
  .joueur-nom{flex:1;font-size:15px;font-weight:700;}
  .joueur-blessure{font-size:11px;background:rgba(196,57,47,.15);color:var(--rouge);border:1px solid rgba(196,57,47,.3);padding:3px 8px;border-radius:999px;}

  /* MÉTRIQUES */
  .joueur-metriques{display:grid;gap:6px;}
  .joueur-metriques.cols4{grid-template-columns:repeat(4,1fr);}
  .joueur-metriques.cols3{grid-template-columns:repeat(3,1fr);}
  .joueur-metriques.cols2{grid-template-columns:repeat(2,1fr);}
  .metrique{background:var(--panneau-clair);border-radius:10px;padding:10px 8px;text-align:center;}
  .metrique .m-val{font-size:17px;font-weight:700;margin-bottom:2px;}
  .metrique .m-lbl{font-size:10px;color:var(--texte-att);line-height:1.3;}
  .m-vert{color:var(--vert);} .m-or{color:var(--or);} .m-rouge{color:var(--rouge);} .m-bleu{color:var(--bleu);} .m-gris{color:var(--texte-att);}

  /* DÉTAIL */
  .joueur-detail{display:none;margin-top:12px;border-top:1px solid var(--ligne);padding-top:12px;}
  .joueur-detail.show{display:block;}
  .detail-titre{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--texte-att);margin-bottom:8px;font-weight:700;}
  .detail-ligne{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--ligne);}
  .detail-ligne:last-child{border-bottom:none;}
  .detail-ligne .d-lbl{color:var(--texte-att);}
  .detail-ligne .d-val{font-weight:600;}
  .detail-section{margin-bottom:12px;}

  .historique-mini{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .histo-point{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .nv1{background:rgba(58,157,90,.2);color:var(--vert);}
  .nv2{background:rgba(212,168,46,.15);color:var(--or);}
  .nv3{background:rgba(212,113,31,.2);color:#d4711f;}
  .nv4{background:rgba(196,57,47,.2);color:var(--rouge);}
  .nv5{background:rgba(74,74,82,.3);color:#9aa0ad;}
  .rpe-bas{background:rgba(58,157,90,.2);color:var(--vert);}
  .rpe-moy{background:rgba(212,168,46,.15);color:var(--or);}
  .rpe-haut{background:rgba(196,57,47,.2);color:var(--rouge);}

  .alerte-ligne{background:rgba(196,57,47,.08);border:1px solid rgba(196,57,47,.25);border-radius:8px;padding:8px 10px;font-size:12px;color:#e8a39d;margin-top:6px;}

  /* BLESSURES */
  .blessure-item{display:flex;align-items:flex-start;gap:10px;background:var(--panneau-clair);border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
  .blessure-item.active-inj{border-color:var(--rouge);background:rgba(196,57,47,.08);}
  .blessure-item.repris-inj{border-color:var(--vert);background:rgba(58,157,90,.08);}
  .blessure-zone{font-size:13px;font-weight:700;}
  .blessure-meta{font-size:11px;color:var(--texte-att);margin-top:2px;line-height:1.4;}
  .blessure-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .blessure-badge.traumatique{background:rgba(196,57,47,.15);color:var(--rouge);}
  .blessure-badge.surcharge{background:rgba(212,168,46,.15);color:var(--or);}
  .blessure-badge.croissance{background:rgba(74,125,214,.15);color:var(--bleu);}
  .blessure-badge.autre{background:var(--panneau-clair);color:var(--texte-att);}
  .intensite-dots{display:flex;gap:3px;margin-top:4px;}
  .i-dot{width:8px;height:8px;border-radius:50%;background:var(--ligne);}
  .i-dot.i1{background:var(--vert);} .i-dot.i2{background:#8fc43a;} .i-dot.i3{background:var(--or);} .i-dot.i4{background:#d4611f;} .i-dot.i5{background:var(--rouge);}

  /* SAISON — BILAN */
  .bilan-zone-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bilan-zone-bar .bz-lbl{font-size:12px;flex:1;}
  .bilan-zone-bar .bz-count{font-size:12px;font-weight:700;color:var(--rouge);width:20px;text-align:right;}
  .bilan-zone-bar .bz-track{width:60px;height:6px;border-radius:999px;background:var(--ligne);overflow:hidden;}
  .bilan-zone-bar .bz-fill{height:100%;border-radius:999px;background:var(--rouge);}

  .last-update{text-align:right;font-size:11px;color:var(--texte-att);margin-bottom:10px;}
  .footer-note{text-align:center;color:var(--texte-att);font-size:11.5px;margin-top:26px;line-height:1.5;}

  /* EXPORT */
  .export-zone{background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;padding:18px;margin-top:20px;}
  .export-zone h3{font-size:14px;font-weight:700;margin:0 0 14px;}
  .export-grille-joueurs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
  .export-joueur-btn{
    background:var(--panneau-clair);border:1.5px solid var(--ligne);color:var(--texte-att);
    padding:8px 6px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;text-align:center;
  }
  .export-joueur-btn.sel{border-color:var(--bleu);background:rgba(74,125,214,.15);color:var(--texte);}
  .export-actions{display:flex;gap:8px;}
  .export-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ligne);background:var(--panneau-clair);color:var(--texte-att);font-size:13px;cursor:pointer;}
  .export-actions button:hover{border-color:var(--bleu);color:var(--texte);}
  .btn-export-pdf{background:var(--rouge) !important;color:#fff !important;border-color:var(--rouge) !important;font-weight:700;}
  .btn-export-pdf:hover{opacity:.88;}
  .btn-export-pdf:disabled{background:#3a3e48 !important;color:#7a7e88 !important;border-color:var(--ligne) !important;cursor:not-allowed;}
  .export-status{font-size:12px;color:var(--texte-att);text-align:center;margin-top:10px;min-height:16px;}
  .vide{text-align:center;color:var(--texte-att);font-size:14px;padding:30px;border:1px dashed var(--ligne);border-radius:14px;}


</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="tag">Cockpit · U13 Limoges Football</span>
    <h1>📊 Vue Saison</h1>
    <div class="date" id="dateAffichee"></div>
  </div>

  <div id="ecranAuth">
    <div class="auth-box">
      <h2>Accès coach</h2>
      <input type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" id="inputPIN" placeholder="••••">
      <button id="btnAuth">Accéder</button>
      <div class="auth-erreur" id="authErreur">Code incorrect.</div>
    </div>
  </div>

  <div id="ecranCockpit" style="display:none;">

    <div class="actions-bar">
      <button id="btnActualiser">🔄 Actualiser</button>
      <button id="btnDeconnexion">🔒 Verrouiller</button>
    </div>

    <!-- SÉLECTEUR DE VUE -->
    <div class="vues-tabs">
      <button class="vue-tab active" data-vue="7j">7 derniers<br>jours</button>
      <button class="vue-tab" data-vue="30j">30 derniers<br>jours</button>
      <button class="vue-tab" data-vue="3m">3 derniers<br>mois</button>
      <button class="vue-tab" data-vue="saison">Saison<br>complète</button>
    </div>

    <div class="vue-desc" id="vueDesc"></div>

    <div class="chargement" id="chargement">
      <span class="spinner">⚙️</span>Chargement des données…
    </div>

    <div id="contenuCockpit" style="display:none;">
      <div class="last-update" id="lastUpdate"></div>
      <div class="resume-equipe" id="resumeEquipe"></div>
      <div class="filtres" id="filtresZone" style="display:none;">
        <button class="filtre-btn active" data-filtre="tous">Tous</button>
        <button class="filtre-btn" data-filtre="rouge">🔴 À risque</button>
        <button class="filtre-btn" data-filtre="or">🟡 À surveiller</button>
        <button class="filtre-btn" data-filtre="vert">🟢 En forme</button>
        <button class="filtre-btn" data-filtre="blesse">🤕 Blessés</button>
      </div>
      <div class="grille-cockpit" id="grilleCockpit"></div>
    </div>

  </div>

  <!-- ZONE EXPORT -->
  <div class="export-zone" id="exportZone" style="display:none;">
    <h3>📄 Exporter des fiches joueurs (PDF)</h3>
    <div class="export-grille-joueurs" id="exportGrilleJoueurs"></div>
    <div class="export-actions">
      <button id="btnSelectTous">Tout sélectionner</button>
      <button id="btnDeselectTous">Tout désélectionner</button>
      <button class="btn-export-pdf" id="btnExportPDF" disabled>Télécharger PDF</button>
    </div>
    <div class="export-status" id="exportStatus"></div>
  </div>

  <div class="footer-note">Données agrégées depuis Météo · RPE · Match Day · Blessures</div>
</div>

<script>
(function(){
  var HASH_PIN = "575a30bd2975cd02639884b04cc27006ac46473358f0d2f1380cd88abda303ba"; // empreinte SHA-256 du code, jamais le code lui-même
  var SESSION_KEY = "cockpit_auth_v2";

  function hashTexte(txt){
    var donnees = new TextEncoder().encode(txt);
    return crypto.subtle.digest("SHA-256", donnees).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }
  var URL_METEO    = "https://script.google.com/macros/s/AKfycbw9ychbh5oSoc-k22FnT7mmCf04684C2hJmllRDATvNQR37I_Udwpn3mHTAVvA3af9cRQ/exec";
  var URL_RPE      = "https://script.google.com/macros/s/AKfycbxpcsBjwqNDR7LkbT53krZK2d29iQlDzpOUovqD2FCnEGHjENNWE6orj6upb7PtHrLo/exec";
  var URL_MATCHDAY = "https://script.google.com/macros/s/AKfycbzYTdTfQWN9CCujM7p4JwNplNgmOIz9HyA1hv609FQWiQeRXlYE3h-Xj40ekKI5Wpwpaw/exec";
  var URL_BLESSURE = "https://script.google.com/macros/s/AKfycby1AFv80LuZ9lDI1jK22YOwFLhccuX6V2AU3LVVT15qHQKWFi62b_HTKZOSop6Exn2t/exec";

  var EFFECTIF = ["Abdoul Karim","Adam","Bakoutoubo","Bilel","Emir","Ethan","Gabin","Hadi","Issam","Jalil","Kalifa","Keys","Loan","Mathis","Melih","Mickaël","Nourou","Pablo","Sacha","Sarah","Sebastien","Yanis"];

  var ZONES_LABELS = {
    tete:"Tête",epaule:"Épaule",coude:"Coude",poignet_main:"Poignet / Main",
    dos_rachis:"Dos / Rachis",hanche_bassin:"Hanche / Bassin",adducteurs:"Adducteurs / aine",
    ischio:"Ischio-jambiers",cuisse:"Quadriceps",genou_tta:"Genou — avant (TTA)",genou_autre:"Genou — autre",
    tibia:"Tibia",mollet:"Mollet",cheville:"Cheville",talon:"Talon",pied:"Pied",autre:"Autre"
  };

  var moisFr = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var moisFrC = ["jan","fév","mar","avr","mai","jun","jul","aoû","sep","oct","nov","déc"];
  var joursFr = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function formatDate(d){ return joursFr[d.getDay()]+" "+d.getDate()+" "+moisFr[d.getMonth()]+" "+d.getFullYear(); }
  function normalDate(str){
    if(!str) return "";
    if(typeof str==="object") str=str.toString();
    if(str.length>10){
      try{ var d=new Date(str); if(!isNaN(d.getTime())){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); } }catch(e){}
      return str.substring(0,10);
    }
    return str;
  }
  function dateDepuis(jours){
    var d=new Date(); d.setDate(d.getDate()-jours); d.setHours(0,0,0,0); return d;
  }
  function debutSaison(){
    var d=new Date();
    var annee = d.getMonth()<7 ? d.getFullYear()-1 : d.getFullYear(); // avant août = saison précédente
    return new Date(annee,7,1); // 1er août
  }

  document.getElementById("dateAffichee").textContent = formatDate(new Date());

  // ---- AUTH ----
  var inputPIN = document.getElementById("inputPIN");
  inputPIN.addEventListener("input", function(){ this.value=this.value.replace(/[^0-9]/g,"").slice(0,4); });
  document.getElementById("btnAuth").addEventListener("click", function(){
    hashTexte(inputPIN.value.trim()).then(function(h){
      if(h!==HASH_PIN){
        document.getElementById("authErreur").style.display="block";
        inputPIN.value="";
        return;
      }
      document.getElementById("authErreur").style.display="none";
      sessionStorage.setItem(SESSION_KEY,"1");
      inputPIN.value="";
      ouvrirCockpit();
    });
  });
  if(sessionStorage.getItem(SESSION_KEY)==="1") ouvrirCockpit();

  function ouvrirCockpit(){
    document.getElementById("ecranAuth").style.display="none";
    document.getElementById("ecranCockpit").style.display="block";
    chargerTout();
  }
  document.getElementById("btnDeconnexion").addEventListener("click", function(){ sessionStorage.removeItem(SESSION_KEY); location.reload(); });
  document.getElementById("btnActualiser").addEventListener("click", chargerTout);

  // ---- VUES ----
  var vueActive = "7j";
  var VUES = {
    "7j":    { label:"7 derniers jours",   desc:"Focus terrain : Météo + RPE + blessures actives. Seuils stricts — peu de données, chaque signal compte.", risque:true },
    "30j":   { label:"30 derniers jours",  desc:"Vue équilibrée : toutes les métriques actives. Idéale pour le suivi hebdomadaire.", risque:true },
    "3m":    { label:"3 derniers mois",    desc:"Vue performance : Hooper + blessures. Météo et RPE affichés mais hors calcul du risque.", risque:false },
    "saison":{ label:"Saison complète (août → juin)", desc:"Bilan global : jours d'absence, zones de blessures récurrentes, Hooper moyen sur la saison. Pas d'indicateur de risque.", risque:false }
  };

  document.querySelectorAll(".vue-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".vue-tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      vueActive = tab.getAttribute("data-vue");
      document.getElementById("vueDesc").textContent = VUES[vueActive].desc;
      if(donneesBrutes) afficherCockpit(donneesBrutes);
    });
  });
  document.getElementById("vueDesc").textContent = VUES["7j"].desc;

  // ---- FILTRES ----
  var filtreActif = "tous";
  document.querySelectorAll(".filtre-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".filtre-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      filtreActif = btn.getAttribute("data-filtre");
      if(donneesBrutes) afficherCockpit(donneesBrutes);
    });
  });

  // ---- CHARGEMENT ----
  var donneesBrutes = null;
  function chargerTout(){
    document.getElementById("chargement").style.display="block";
    document.getElementById("contenuCockpit").style.display="none";
    Promise.all([
      fetch(URL_METEO).then(function(r){ return r.json(); }).then(function(d){ return Array.isArray(d)?d:[]; }).catch(function(){ return []; }),
      fetch(URL_RPE+"?type=rpe_post").then(function(r){ return r.json(); }).then(function(d){ return Array.isArray(d)?d:[]; }).catch(function(){ return []; }),
      fetch(URL_MATCHDAY+"?type=hooper").then(function(r){ return r.json(); }).then(function(d){ return Array.isArray(d)?d:[]; }).catch(function(){ return []; }),
      fetch(URL_BLESSURE+"?action=list").then(function(r){ return r.json(); }).then(function(d){ return Array.isArray(d)?d:[]; }).catch(function(){ return []; })
    ]).then(function(res){
      donneesBrutes = { meteo:res[0], rpe:res[1], hooper:res[2], blessures:res[3] };
      afficherCockpit(donneesBrutes);
      document.getElementById("lastUpdate").textContent = "Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    }).catch(function(){
      document.getElementById("chargement").innerHTML="<div class='vide'>Impossible de charger les données. Vérifiez votre connexion.</div>";
    });
  }

  // ---- ANALYSE selon la vue ----
  function bornesVue(vue){
    var fin = new Date(); fin.setHours(23,59,59,999);
    var debut;
    if(vue==="7j") debut=dateDepuis(7);
    else if(vue==="30j") debut=dateDepuis(30);
    else if(vue==="3m") debut=dateDepuis(91);
    else debut=debutSaison();
    return {debut:debut, fin:fin};
  }

  function filtrerParDate(tableau, bornes, champDate){
    return tableau.filter(function(d){
      var dateStr = normalDate(d[champDate||"date"]);
      if(!dateStr) return false;
      var d2 = new Date(dateStr+"T12:00:00");
      return d2>=bornes.debut && d2<=bornes.fin;
    });
  }

  function analyserJoueur(nom, data, vue){
    var bornes = bornesVue(vue);
    var j = {
      nom:nom, vue:vue,
      meteo:  {donnees:[], moyenne:null},
      rpe:    {donnees:[], moyenne:null, alerteIntense:false},
      hooper: {donnees:[], moyenne:null, dernier:null},
      blessure:{actuelle:null, recentes:[], joursAbsence:0, parZone:{}, dernierRetour:null},
      risque:"bilan", alertes:[]
    };

    // MÉTÉO
    j.meteo.donnees = filtrerParDate(
      (data.meteo||[]).filter(function(d){ return d.nom===nom; }),
      bornes
    ).map(function(d){ return {date:normalDate(d.date), niveau:parseInt(d.niveau,10)}; })
     .sort(function(a,b){ return a.date<b.date?1:-1; });

    if(j.meteo.donnees.length>0){
      var s=0; j.meteo.donnees.forEach(function(d){ s+=d.niveau; });
      j.meteo.moyenne = (s/j.meteo.donnees.length).toFixed(1);
    }

    // RPE
    j.rpe.donnees = filtrerParDate(
      (data.rpe||[]).filter(function(d){ return d.nom===nom; }),
      bornes
    ).map(function(d){ return {date:normalDate(d.date), rpe:parseInt(d.rpe,10)}; })
     .sort(function(a,b){ return a.date<b.date?1:-1; });

    if(j.rpe.donnees.length>0){
      var s=0; j.rpe.donnees.forEach(function(d){ s+=d.rpe; });
      j.rpe.moyenne = (s/j.rpe.donnees.length).toFixed(1);
      var recentes = j.rpe.donnees.slice(0,3);
      var nbInt = recentes.filter(function(d){ return d.rpe>=8; }).length;
      if(nbInt>=2) j.rpe.alerteIntense=true;
    }

    // HOOPER
    j.hooper.donnees = filtrerParDate(
      (data.hooper||[]).filter(function(d){ return d.nom===nom && d.palier!=="_verif"; }),
      bornes
    ).map(function(d){
      var t=(parseInt(d.sommeil,10)||0)+(parseInt(d.fatigue,10)||0)+(parseInt(d.humeur,10)||0)+(parseInt(d.douleurs,10)||0)+(parseInt(d.motivation,10)||0);
      return {date:normalDate(d.date), total:t};
    }).sort(function(a,b){ return a.date<b.date?1:-1; });

    if(j.hooper.donnees.length>0){
      var s=0; j.hooper.donnees.forEach(function(d){ s+=d.total; });
      j.hooper.moyenne=(s/j.hooper.donnees.length).toFixed(1);
      j.hooper.dernier=j.hooper.donnees[0];
    }

    // BLESSURES
    var aujourd_hui = new Date();
    (data.blessures||[]).filter(function(d){ return (d.joueur||d.nom)===nom; }).forEach(function(d){
      var dateStr = normalDate(d.date);
      if(!dateStr) return;
      var dateBl = new Date(dateStr+"T12:00:00");
      var duree = parseInt(d.dureeJours,10)||0;
      var statut = d.statut||"";

      // Statut réel (issu de "Retours à valider") en priorité ; on ne retombe
      // sur l'estimation de durée que pour les lignes créées avant ce suivi.
      var actif;
      if(statut){
        actif = statut==="En cours";
      } else {
        var dateRetourEst = new Date(dateBl);
        if(duree>0) dateRetourEst.setDate(dateBl.getDate()+duree);
        actif = duree===-1 || (duree>0 && dateRetourEst>=aujourd_hui);
      }

      // Jours d'absence réels : date de fin réelle si le joueur est revenu,
      // jours écoulés depuis la blessure si toujours en cours, sinon l'estimation
      // de départ pour les anciennes lignes sans statut.
      var joursAbs = 0;
      if(statut==="Repris" && d.dateFinReelle){
        var dateFin = new Date(normalDate(d.dateFinReelle)+"T12:00:00");
        joursAbs = Math.max(0, Math.round((dateFin-dateBl)/86400000));
      } else if(actif){
        joursAbs = Math.max(0, Math.round((aujourd_hui-dateBl)/86400000));
      } else if(duree>0){
        joursAbs = duree;
      } else if(duree===-1){
        joursAbs = 30;
      }

      if(actif && !j.blessure.actuelle) j.blessure.actuelle=d;
      j.blessure.joursAbsence += joursAbs;

      if(statut==="Repris" && d.dateFinReelle && (!j.blessure.dernierRetour || normalDate(d.dateFinReelle)>normalDate(j.blessure.dernierRetour.dateFinReelle))){
        j.blessure.dernierRetour = d;
      }

      if(dateBl>=bornes.debut){
        j.blessure.recentes.push(d);
        var z=d.zone||"autre";
        j.blessure.parZone[z]=(j.blessure.parZone[z]||0)+1;
      }
    });

    // CALCUL DU RISQUE
    if(vue==="saison"){ j.risque="bilan"; return j; }

    if(j.blessure.actuelle){
      j.risque="rouge";
      j.alertes.push(j.blessure.actuelle.recidive ? "🤕 Blessure en cours — ⚠ récidive sur cette zone" : "🤕 Blessure en cours");
      return j;
    }

    var score=0;
    var mM=parseFloat(j.meteo.moyenne), mR=parseFloat(j.rpe.moyenne), mH=parseFloat(j.hooper.moyenne);
    var aRecidive = j.blessure.recentes.some(function(b){ return b.recidive; });

    if(vue==="7j"){
      if(!isNaN(mM)){ if(mM>=3) score+=3; else if(mM>=2.5) score+=1; }
      if(!isNaN(mR)){ if(mR>=7) score+=2; else if(mR>=6) score+=1; }
      if(j.rpe.alerteIntense){ score+=2; j.alertes.push("⚡ RPE ≥ 8 deux fois cette semaine"); }
      if(j.blessure.recentes.length>=1) score+=1;
      if(aRecidive){ score+=1; j.alertes.push("⚠ Récidive détectée sur une zone déjà touchée"); }
    } else if(vue==="30j"){
      if(!isNaN(mM)){ if(mM>=3.5) score+=3; else if(mM>=3) score+=1; }
      if(!isNaN(mR)){ if(mR>=7.5) score+=2; else if(mR>=6.5) score+=1; }
      if(j.rpe.alerteIntense){ score+=2; j.alertes.push("⚡ RPE ≥ 8 deux fois récemment"); }
      if(j.blessure.recentes.length>=2) score+=2;
      else if(j.blessure.recentes.length===1) score+=1;
      if(aRecidive){ score+=2; j.alertes.push("⚠ Récidive détectée sur une zone déjà touchée"); }
    } else if(vue==="3m"){
      // Météo et RPE affichés mais pas dans le calcul
      if(!isNaN(mH)){ if(mH>=18) score+=3; else if(mH>=14) score+=1; }
      if(j.blessure.recentes.length>=3){ score+=2; j.alertes.push("🤕 "+j.blessure.recentes.length+" blessures sur 3 mois"); }
      else if(j.blessure.recentes.length>=2) score+=1;
      if(j.blessure.joursAbsence>=14) score+=1;
      if(aRecidive){ score+=1; j.alertes.push("⚠ Récidive détectée sur une zone déjà touchée"); }
    }

    if(!isNaN(mM) && mM>=3.5) j.alertes.push("😴 Fatigue élevée (météo moy. "+mM+"/5)");
    if(!isNaN(mH) && mH>=18) j.alertes.push("📋 Hooper préoccupant ("+mH+"/25)");

    if(score>=5) j.risque="rouge";
    else if(score>=2) j.risque="or";
    else j.risque="vert";

    return j;
  }

  function afficherCockpit(data){

    document.getElementById("contenuCockpit").style.display="block";

    var vue=vueActive;

    document.getElementById("filtresZone").style.display = avecRisque ? "flex" : "none";

    // Analyser tous les joueurs
    var joueurs = {};
    EFFECTIF.forEach(function(nom){ joueurs[nom]=analyserJoueur(nom,data,vue); });

    // Résumé
    var nbV=0,nbO=0,nbR=0,nbB=0;
    EFFECTIF.forEach(function(nom){
      var j=joueurs[nom];
      if(j.blessure.actuelle) nbB++;
      if(j.risque==="vert") nbV++;
      else if(j.risque==="or") nbO++;

        '<div class="resume-card"><div class="r-val" style="color:var(--rouge)">'+nbB+'</div><div class="r-lbl">🤕 Blessés</div></div>'+

        var cM=mM?( parseFloat(mM)<=2?"m-vert":parseFloat(mM)<=3?"m-or":"m-rouge"):"m-gris";
        var cR=mR?(parseFloat(mR)<=5?"m-vert":parseFloat(mR)<=7?"m-or":"m-rouge"):"m-gris";
        var cH=j.hooper.moyenne?( parseFloat(j.hooper.moyenne)<=10?"m-vert":parseFloat(j.hooper.moyenne)<=16?"m-or":"m-rouge"):"m-gris";
        metriquesHTML='<div class="joueur-metriques cols4">'+
          '<div class="metrique"><div class="m-val '+(cM)+'">'+( mM||"—")+'</div><div class="m-lbl">Météo moy./5</div></div>'+
          '<div class="metrique"><div class="m-val '+(cR)+'">'+( mR||"—")+'</div><div class="m-lbl">RPE moy./10</div></div>'+
          '<div class="metrique"><div class="m-val '+(cH)+'">'+( mH||"—")+'</div><div class="m-lbl">Hooper dernier</div></div>'+
          '<div class="metrique"><div class="m-val '+(j.alertes.length>0?"m-rouge":"m-vert")+'">'+j.alertes.length+'</div><div class="m-lbl">Alertes</div></div>'+
          '</div>';
      } else if(vue==="3m"){

        metriquesHTML='<div class="joueur-metriques cols3">'+
          '<div class="metrique"><div class="m-val '+(cH2)+'">'+( mH2||"—")+'/25</div><div class="m-lbl">Hooper moyen</div></div>'+
          '<div class="metrique"><div class="m-val '+(j.blessure.recentes.length>0?"m-rouge":"m-vert")+'">'+j.blessure.recentes.length+'</div><div class="m-lbl">Blessures 3 mois</div></div>'+
          '<div class="metrique"><div class="m-val '+(j.blessure.joursAbsence>7?"m-or":"m-vert")+'">'+j.blessure.joursAbsence+'j</div><div class="m-lbl">Absence totale</div></div>'+
          '</div>';
      } else { // saison
        metriquesHTML='<div class="joueur-metriques cols2">'+
          '<div class="metrique"><div class="m-val '+(j.blessure.recentes.length>0?"m-rouge":"m-vert")+'">'+j.blessure.recentes.length+'</div><div class="m-lbl">Blessures saison</div></div>'+
          '<div class="metrique"><div class="m-val '+(j.blessure.joursAbsence>0?"m-or":"m-vert")+'">'+j.blessure.joursAbsence+'j</div><div class="m-lbl">Jours d\'absence</div></div>'+
          '</div>';
      }

      // DÉTAIL
      var alertesHTML=j.alertes.map(function(a){ return '<div class="alerte-ligne">'+a+'</div>'; }).join("");

      var histoMeteo=j.meteo.donnees.slice(0,8).map(function(d){
        return '<div class="histo-point nv'+d.niveau+'">'+d.niveau+'</div>';
      }).join("");

      var histoRPE=j.rpe.donnees.slice(0,8).map(function(d){
        var c=d.rpe<=5?"rpe-bas":d.rpe<=7?"rpe-moy":"rpe-haut";

      var blessuresHTML=j.blessure.recentes.length>0 ? renderBlessures(j.blessure.recentes, vue) : "";

      // Vue saison : zones récurrentes

  function renderBlessures(recentes, vue){
    var label = vue==="saison" ? "Blessures saison" : "Blessures — "+VUES[vue].label;
    var html='<div class="detail-section"><div class="detail-titre">🤕 '+label+' ('+recentes.length+')</div>';
    var aujourd_hui=new Date();
    recentes.sort(function(a,b){ return normalDate(b.date)>normalDate(a.date)?1:-1; });
    recentes.forEach(function(b){
      var dateStr=normalDate(b.date);
      var d=new Date(dateStr+"T12:00:00");
      var dateAff=d.getDate()+" "+moisFrC[d.getMonth()];
      var zone=b.zoneLabel||ZONES_LABELS[b.zone]||b.zone||"—";
      var type=b.type||"autre";
      var duree=parseInt(b.dureeJours,10)||0;
      var statut=b.statut||"";

      var actif;
      if(statut){ actif = statut==="En cours"; }
      else{ var dr=new Date(d); if(duree>0) dr.setDate(d.getDate()+duree); actif = duree===-1||(duree>0&&dr>=aujourd_hui); }

      var statutAff;
      if(statut==="Repris" && b.dateFinReelle){
        var df=new Date(normalDate(b.dateFinReelle)+"T12:00:00");
        statutAff = "revenu le "+df.getDate()+" "+moisFrC[df.getMonth()];
      } else if(statut==="A joué quand même"){
        statutAff = "a joué quand même";
      } else if(actif){
        statutAff = "en cours"+(duree>0?" ("+duree+"j est.)":"");
      } else {
        statutAff = duree===-1?"saison entière":(duree===0?"joue quand même":duree+" j est.");
      }

      var intensite=parseInt(b.intensite,10)||0;
      var dots=""; for(var i=1;i<=5;i++) dots+='<div class="i-dot'+(i<=intensite?" i"+intensite:"")+'"></div>';
      html+='<div class="blessure-item'+(actif?" active-inj":(statut==="Repris"?" repris-inj":''))+'">';
      html+='<div style="flex:1"><div class="blessure-zone">'+(actif?"🔴 ":(statut==="Repris"?"✅ ":""))+escapeHTML(zone)+(b.zoneCroissance?" ⚠":"")+(b.recidive?" · récidive":"")+'</div>';
      html+='<div class="blessure-meta">'+dateAff+" · "+statutAff+(b.cause?" · "+escapeHTML(b.cause):"")+'</div>';
      html+='<div class="intensite-dots">'+dots+'</div></div>';
      html+='<span class="blessure-badge '+escapeHTML(type)+'">'+escapeHTML(type)+'</span></div>';
    });
    html+='</div>';
    return html;
  }

  var exportSelectionnes = {};

  function construireGrilleExport(){
    var grille = document.getElementById("exportGrilleJoueurs");
    grille.innerHTML = "";
    EFFECTIF.forEach(function(nom){
      var btn = document.createElement("button");
      btn.className = "export-joueur-btn" + (exportSelectionnes[nom] ? " sel" : "");
      btn.textContent = nom;
      btn.addEventListener("click", function(){
        exportSelectionnes[nom] = !exportSelectionnes[nom];
        btn.classList.toggle("sel", exportSelectionnes[nom]);
        mettreAJourBtnExport();
      });
      grille.appendChild(btn);
    });
    mettreAJourBtnExport();
  }

  function mettreAJourBtnExport(){
    var nb = Object.values(exportSelectionnes).filter(Boolean).length;
    var btn = document.getElementById("btnExportPDF");
    btn.disabled = nb === 0;
    btn.textContent = nb > 0 ? "Télécharger PDF ("+nb+" joueur"+(nb>1?"s":"")+")" : "Télécharger PDF";
  }

  document.getElementById("btnSelectTous").addEventListener("click", function(){
    EFFECTIF.forEach(function(nom){ exportSelectionnes[nom] = true; });
    construireGrilleExport();
  });

  document.getElementById("btnDeselectTous").addEventListener("click", function(){
    EFFECTIF.forEach(function(nom){ exportSelectionnes[nom] = false; });
    construireGrilleExport();
  });

  document.getElementById("btnExportPDF").addEventListener("click", function(){
    var joueursSel = EFFECTIF.filter(function(nom){ return exportSelectionnes[nom]; });
    if(joueursSel.length === 0) return;
    if(!donneesBrutes){ alert("Actualisez les données avant d'exporter."); return; }
    genererPDF(joueursSel);
  });

  function genererPDF(joueurs){
    var statusEl = document.getElementById("exportStatus");
    var btn = document.getElementById("btnExportPDF");
    btn.disabled = true;
    statusEl.textContent = "Génération en cours…";

    try{
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      var pageW = 210, pageH = 297;
      var mL = 15, mR = 15, mT = 20;
      var contentW = pageW - mL - mR;

      var vuesPeriodes = ["7j","30j","3m","saison"];
      var vuesLabels = {"7j":"7 derniers jours","30j":"30 derniers jours","3m":"3 derniers mois","saison":"Saison complète (août → juin)"};

      var dateExport = new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});

      joueurs.forEach(function(nom, idx){
        if(idx > 0) doc.addPage();

        var y = mT;

        // ---- EN-TÊTE ----
        doc.setFillColor(15,17,21);
        doc.rect(0,0,pageW,22,"F");
        doc.setTextColor(238,240,243);
        doc.setFontSize(14); doc.setFont("helvetica","bold");
        doc.text("U13 Limoges Football — Fiche joueur", mL, 10);
        doc.setFontSize(9); doc.setFont("helvetica","normal");
        doc.text("Exporté le "+dateExport, mL, 16);
        doc.text("Page "+(idx+1)+"/"+joueurs.length, pageW-mR, 16, {align:"right"});

        y = 30;

        // ---- NOM JOUEUR ----
        doc.setFillColor(26,29,36);
        doc.roundedRect(mL, y, contentW, 14, 3, 3, "F");
        doc.setTextColor(238,240,243);
        doc.setFontSize(16); doc.setFont("helvetica","bold");
        doc.text(nom, mL+6, y+9);
        y += 20;

        // ---- 4 VUES ----
        vuesPeriodes.forEach(function(vue){
          var j = analyserJoueur(nom, donneesBrutes, vue);
          var avecRisque = vue==="7j"||vue==="30j";

          // Titre vue
          doc.setFillColor(34,38,47);
          doc.rect(mL, y, contentW, 8, "F");
          doc.setTextColor(154,160,173);
          doc.setFontSize(8); doc.setFont("helvetica","bold");
          doc.text(vuesLabels[vue].toUpperCase(), mL+4, y+5.5);

          // Indicateur risque
          if(avecRisque){
            var risqueLabel = {vert:"EN FORME",or:"À SURVEILLER",rouge:"À RISQUE",bilan:"BILAN"};
            var risqueColor = {vert:[58,157,90],or:[212,168,46],rouge:[196,57,47],bilan:[74,125,214]};
            var rc = risqueColor[j.risque]||[154,160,173];
            doc.setFillColor(rc[0],rc[1],rc[2]);
            var rl = risqueLabel[j.risque]||"";
            doc.setTextColor(255,255,255);
            doc.setFontSize(7);
            var rw = doc.getTextWidth(rl)+6;
            doc.roundedRect(mL+contentW-rw-1, y+1, rw, 6, 1.5, 1.5, "F");
            doc.text(rl, mL+contentW-rw/2-1, y+5.2, {align:"center"});
          }

          y += 11;

          // Métriques selon vue
          var metriques = [];
          if(vue==="7j"||vue==="30j"){
            metriques = [
              {lbl:"Météo moy.", val:j.meteo.moyenne||"—", unit:"/5", ok:j.meteo.moyenne?(parseFloat(j.meteo.moyenne)<=2?1:parseFloat(j.meteo.moyenne)<=3?2:3):0},
              {lbl:"RPE moy.", val:j.rpe.moyenne||"—", unit:"/10", ok:j.rpe.moyenne?(parseFloat(j.rpe.moyenne)<=5?1:parseFloat(j.rpe.moyenne)<=7?2:3):0},
              {lbl:"Hooper dernier", val:j.hooper.dernier?j.hooper.dernier.total:"—", unit:"/25", ok:j.hooper.moyenne?(parseFloat(j.hooper.moyenne)<=10?1:parseFloat(j.hooper.moyenne)<=16?2:3):0},
              {lbl:"Séances météo", val:j.meteo.donnees.length, unit:"", ok:1},
              {lbl:"Séances RPE", val:j.rpe.donnees.length, unit:"", ok:1}
            ];
          } else if(vue==="3m"){
            metriques = [
              {lbl:"Hooper moyen", val:j.hooper.moyenne||"—", unit:"/25", ok:j.hooper.moyenne?(parseFloat(j.hooper.moyenne)<=10?1:parseFloat(j.hooper.moyenne)<=16?2:3):0},
              {lbl:"Blessures", val:j.blessure.recentes.length, unit:"", ok:j.blessure.recentes.length===0?1:j.blessure.recentes.length<=2?2:3},
              {lbl:"Jours d'absence", val:j.blessure.joursAbsence+"j", unit:"", ok:j.blessure.joursAbsence===0?1:j.blessure.joursAbsence<=7?2:3},
              {lbl:"Matchs Hooper", val:j.hooper.donnees.length, unit:"", ok:1}
            ];
          } else {
            metriques = [
              {lbl:"Blessures saison", val:j.blessure.recentes.length, unit:"", ok:j.blessure.recentes.length===0?1:j.blessure.recentes.length<=3?2:3},
              {lbl:"Jours d'absence", val:j.blessure.joursAbsence+"j", unit:"", ok:j.blessure.joursAbsence===0?1:j.blessure.joursAbsence<=14?2:3},
              {lbl:"Hooper moy. saison", val:j.hooper.moyenne||"—", unit:"/25", ok:j.hooper.moyenne?(parseFloat(j.hooper.moyenne)<=10?1:parseFloat(j.hooper.moyenne)<=16?2:3):0},
              {lbl:"Matchs analysés", val:j.hooper.donnees.length, unit:"", ok:1}
            ];
          }

          var colW = contentW / metriques.length;
          metriques.forEach(function(m,mi){
            var x = mL + mi*colW;
            doc.setFillColor(22,26,33);
            doc.roundedRect(x+1, y, colW-2, 16, 2, 2, "F");
            var colors = {0:[154,160,173], 1:[58,157,90], 2:[212,168,46], 3:[196,57,47]};
            var c = colors[m.ok]||colors[0];
            doc.setTextColor(c[0],c[1],c[2]);
            doc.setFontSize(11); doc.setFont("helvetica","bold");
            doc.text(String(m.val)+m.unit, x+colW/2, y+8, {align:"center"});
            doc.setTextColor(154,160,173);
            doc.setFontSize(6.5); doc.setFont("helvetica","normal");
            doc.text(m.lbl, x+colW/2, y+13.5, {align:"center"});
          });
          y += 19;

          // Alertes
          if(j.alertes.length > 0 && avecRisque){
            j.alertes.forEach(function(a){
              doc.setFillColor(196,57,47,30);
              doc.setDrawColor(196,57,47);
              doc.roundedRect(mL, y, contentW, 7, 1.5, 1.5, "FD");
              doc.setTextColor(196,57,47);
              doc.setFontSize(7.5); doc.setFont("helvetica","normal");
              var aStr = a.replace(/[🟢🟡🔴⚡😴📋🤕]/g,"").trim();
              doc.text("⚠ "+aStr, mL+4, y+4.8);
              y += 9;
            });
          }

          // Blessures récentes (toutes vues)
          if(j.blessure.recentes.length > 0){
            var blMax = vue==="saison" ? j.blessure.recentes.length : Math.min(j.blessure.recentes.length, 3);
            var blTri = j.blessure.recentes.slice(0,blMax);
            doc.setTextColor(154,160,173);
            doc.setFontSize(7); doc.setFont("helvetica","bold");
            doc.text("BLESSURES ("+j.blessure.recentes.length+")", mL, y+4);
            y += 7;
            blTri.forEach(function(b){
              var zone = b.zoneLabel||ZONES_LABELS[b.zone]||b.zone||"—";
              var type = b.type||"—";
              var duree = parseInt(b.dureeJours,10)||0;
              var statut = b.statut||"";
              var dateStr = normalDate(b.date);
              var d = new Date(dateStr+"T12:00:00");
              var dateAff = d.getDate()+"/"+(d.getMonth()+1);
              var actif = statut ? statut==="En cours" : (duree===-1||(duree>0 && new Date(d.getTime()+duree*86400000)>=new Date()));
              var repris = statut==="Repris";
              var dureeAff;
              if(repris && b.dateFinReelle){
                var df=new Date(normalDate(b.dateFinReelle)+"T12:00:00");
                dureeAff = "revenu "+df.getDate()+"/"+(df.getMonth()+1);
              } else {
                dureeAff = duree===-1?"saison":(duree===0?"joue":duree+"j est.");
              }
              if(actif){ doc.setFillColor(80,20,20); doc.setTextColor(196,57,47); }
              else if(repris){ doc.setFillColor(20,45,32); doc.setTextColor(58,157,90); }
              else { doc.setFillColor(34,38,47); doc.setTextColor(154,160,173); }
              doc.roundedRect(mL, y, contentW, 7, 1.5, 1.5, "F");
              doc.setFontSize(7.5); doc.setFont("helvetica","bold");
              doc.text((actif?"● ":(repris?"✓ ":""))+zone+(b.zoneCroissance?" ⚠":"")+(b.recidive?" (récidive)":""), mL+4, y+4.8);
              doc.setFont("helvetica","normal");
              doc.text(dateAff+" · "+type+" · "+dureeAff+(b.intensite?" · int."+b.intensite+"/5":""), mL+contentW-4, y+4.8, {align:"right"});
              y += 9;
            });
          }

          y += 4; // espace entre les vues

          // Vérification si on dépasse la page
          if(y > pageH-20 && vue !== "saison"){
            doc.addPage();
            y = mT;
          }
        });

        // ---- PIED DE PAGE ----
        doc.setFillColor(15,17,21);
        doc.rect(0,pageH-10,pageW,10,"F");
        doc.setTextColor(154,160,173);
        doc.setFontSize(7); doc.setFont("helvetica","normal");
        doc.text("U13 Limoges Football · Cockpit Saison · "+dateExport, pageW/2, pageH-4, {align:"center"});
      });

      var filename = joueurs.length===1
        ? "fiche-"+joueurs[0].replace(/\s/g,"_")+"-"+dateExport.replace(/\//g,"-")+".pdf"
        : "fiches-joueurs-"+dateExport.replace(/\//g,"-")+".pdf";

      doc.save(filename);
      statusEl.textContent = "✅ PDF téléchargé — "+joueurs.length+" fiche"+(joueurs.length>1?"s":"");
    } catch(err){
      statusEl.textContent = "❌ Erreur : "+err.message;
      console.error(err);
    }
    btn.disabled = false;
    mettreAJourBtnExport();
  }

  function escapeHTML(s){ var d=document.createElement("div");d.textContent=s;return d.innerHTML; }
})();
</script>
</body>
</html>
